---
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions: {}

jobs:
  build-and-upload:
    name: Build and upload release archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME}"
          gh release view "${TAG}" > /dev/null 2>&1 || \
            gh release create "${TAG}" --draft --generate-notes --title "v${TAG}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Build modules archive
        run: |
          ARCHIVE_NAME="registry-drupal-modules-${TAG}.tar.gz"
          tar czf "${ARCHIVE_NAME}" \
            computed_address \
            email_protect \
            organization_listing \
            organization_validation \
            org_moderation_sync \
            webform_geonames
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "${GITHUB_ENV}"

      - name: Upload archive to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" "${ARCHIVE_NAME}" --clobber
